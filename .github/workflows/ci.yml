name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 22 is the real floor, and it is set by jsdom (used by the
        # deterministic-extraction sandbox), whose engines are
        # ^22.22.2 || ^24.15.0 || >=26.0.0. Node 20 fails at import time:
        # jsdom's bundled undici calls webidl.util.markAsUncloneable, which
        # that line does not provide. Both entries here are tested LTS lines.
        node: [22, 24]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Optional deps ARE installed: the suite itself runs on fakes and needs
      # neither, but `tsc` needs their type declarations to check the two files
      # that import them (engines/playwright.ts, store/duckdb.ts).
      # This installs the playwright npm package only — the Chromium binary is a
      # separate `npx playwright install`, which no test requires.
      - run: npm ci

      - run: npm run typecheck

      # 116 checks. No network, no API key.
      - run: npm test

      # `npm run test:duck` is deliberately not run here: it exercises the
      # native DuckDB binding rather than Drazta's own logic.
